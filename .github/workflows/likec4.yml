name: Check LikeC4 demonstration
on:
  push:
    paths:
      - 'likec4-poc/**'
      - 'catalog/**'
      - 'contracts/**'
      - 'scripts/generate.py'
      - '.github/workflows/likec4.yml'
  pull_request:
    paths:
      - 'likec4-poc/**'
      - 'catalog/**'
      - 'contracts/**'
      - 'scripts/generate.py'
      - '.github/workflows/likec4.yml'
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: likec4-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: likec4-poc/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: likec4-demo-site
          path: likec4-poc/dist/
          if-no-files-found: error
