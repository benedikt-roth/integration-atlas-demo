name: Check LikeC4 demonstration
on:
  push:
    paths:
      - 'likec4-poc/**'
      - 'catalog/**'
      - 'contracts/**'
      - 'scripts/generate.py'
      - '.github/workflows/likec4.yml'
  pull_request:
    paths:
      - 'likec4-poc/**'
      - 'catalog/**'
      - 'contracts/**'
      - 'scripts/generate.py'
      - '.github/workflows/likec4.yml'
permissions:
  contents: read
concurrency:
  group: likec4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: likec4-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: likec4-poc/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: likec4-demo-site
          path: likec4-poc/dist/
          if-no-files-found: error
  publish-rendered:
    name: Publish rendered page in the repository
    needs: validate-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: likec4-demo-site
          path: ${{ runner.temp }}/likec4-site
      - name: Update the generated output branch
        env:
          LIKEC4_SITE_DIR: ${{ runner.temp }}/likec4-site
          LIKEC4_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_main" != "$LIKEC4_SOURCE_SHA" ]]; then
            echo "Skipping a build superseded on main."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin likec4-rendered > /dev/null; then
            git fetch origin refs/heads/likec4-rendered:refs/remotes/origin/likec4-rendered
            git checkout -B likec4-rendered origin/likec4-rendered
          else
            git checkout --orphan likec4-rendered
            git rm --quiet -rf .
          fi
          rsync -a --delete --exclude=.git "$LIKEC4_SITE_DIR/" ./
          touch .nojekyll
          git add --all
          if git diff --cached --quiet; then
            echo "Rendered output is already current."
            exit 0
          fi
          git commit -m "Build LikeC4 for $LIKEC4_SOURCE_SHA"
          git push origin HEAD:refs/heads/likec4-rendered
