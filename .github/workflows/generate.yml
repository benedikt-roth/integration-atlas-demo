name: Update generated documentation
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - run: python -m pip install -r requirements.txt
      - run: python scripts/atlas.py generate
      - run: python scripts/atlas.py check
      - run: python -m unittest discover -s tests -v
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update generated interface documentation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
