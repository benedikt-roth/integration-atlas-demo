name: Interface documentation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - run: python -m pip install -r requirements.txt
      - run: python scripts/atlas.py check
      - run: python -m unittest discover -s tests -v
